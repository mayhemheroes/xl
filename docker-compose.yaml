services:
  # === Modern versions (silkeh/clang) ===
  llvm-7:
    image: silkeh/clang:7
    volumes:
      - .:/xlr:Z
    working_dir: /xlr
    command: bash
    environment:
      - CC=clang
      - CXX=clang++

  llvm-8:
